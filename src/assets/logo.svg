<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Solid Dark Slate Background -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <!-- Matrix Cell Gradients -->
    <linearGradient id="cell1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="cell2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="cell3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#9333ea" />
    </linearGradient>

    <linearGradient id="cell4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Clean Bracket Stroke Gradient -->
    <linearGradient id="bracketStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>

  <!-- App Icon Base Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGradient)" />

  <!-- Subtle Precision Sub-Grid Dots -->
  <g fill="#1e293b" opacity="0.6">
    <circle cx="160" cy="110" r="3" />
    <circle cx="256" cy="110" r="3" />
    <circle cx="352" cy="110" r="3" />
    <circle cx="160" cy="402" r="3" />
    <circle cx="256" cy="402" r="3" />
    <circle cx="352" cy="402" r="3" />
  </g>

  <!-- Matrix Delimiter Brackets [  ] -->
  <g fill="none" stroke="url(#bracketStroke)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Bracket [ -->
    <path d="M 124 136 L 86 136 L 86 376 L 124 376" />
    <!-- Right Bracket ] -->
    <path d="M 388 136 L 426 136 L 426 376 L 388 376" />
  </g>

  <!-- 2x2 Core Matrix Cells -->
  <g transform="translate(0, 0)">
    <!-- Cell (1,1): Top-Left (Cyan / Blue) -->
    <rect x="150" y="150" width="96" height="96" rx="20" fill="url(#cell1)" />
    <!-- Sub-element: Geometric Matrix Node (1,1) -->
    <circle cx="198" cy="198" r="14" fill="#ffffff" opacity="0.9" />

    <!-- Cell (1,2): Top-Right (Indigo) -->
    <rect x="266" y="150" width="96" height="96" rx="20" fill="url(#cell2)" />
    <!-- Sub-element: Horizontal Matrix Vector Line -->
    <rect x="290" y="193" width="48" height="10" rx="5" fill="#ffffff" opacity="0.9" />

    <!-- Cell (2,1): Bottom-Left (Purple) -->
    <rect x="150" y="266" width="96" height="96" rx="20" fill="url(#cell3)" />
    <!-- Sub-element: Vertical Matrix Vector Line -->
    <rect x="193" y="290" width="10" height="48" rx="5" fill="#ffffff" opacity="0.9" />

    <!-- Cell (2,2): Bottom-Right (Emerald) -->
    <rect x="266" y="266" width="96" height="96" rx="20" fill="url(#cell4)" />
    <!-- Sub-element: Diagonal Cross/Transform Node -->
    <circle cx="314" cy="314" r="14" fill="#ffffff" opacity="0.9" />
  </g>

  <!-- Central Dynamic Vector Axis -->
  <line x1="198" y1="198" x2="314" y2="314" stroke="#ffffff" stroke-width="3" stroke-dasharray="6,6" opacity="0.4" />
</svg>
