<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b" />
      <stop offset="50%" stop-color="#1c2541" />
      <stop offset="100%" stop-color="#0a1128" />
    </linearGradient>

    <!-- Matrix Mesh Wave Gradients -->
    <linearGradient id="waveGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="waveGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff0844" />
      <stop offset="100%" stop-color="#ffb199" />
    </linearGradient>

    <linearGradient id="waveGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f6d365" />
      <stop offset="100%" stop-color="#fda085" />
    </linearGradient>

    <!-- Open Bracket Neon Glow -->
    <linearGradient id="bracketGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0072ff" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Matrix Coordinate Grid -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1.5">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="160" x2="416" y2="160" />
    <line x1="96" y1="224" x2="416" y2="224" />
    <line x1="96" y1="288" x2="416" y2="288" />
    <line x1="96" y1="352" x2="416" y2="352" />
    <line x1="96" y1="416" x2="416" y2="416" />

    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="160" y1="96" x2="160" y2="416" />
    <line x1="224" y1="96" x2="224" y2="416" />
    <line x1="288" y1="96" x2="288" y2="416" />
    <line x1="352" y1="96" x2="352" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- 3D Numerical Wave Membrane (Isometric Mesh) -->
  <g id="membrane" transform="translate(256, 260) scale(1.15)">
    <!-- Base Wave Surface 1 -->
    <path d="M -110,60 Q -50,-10 0,40 T 110,-10 L 90,80 Q 0,110 -90,95 Z"
          fill="url(#waveGrad1)" opacity="0.75" />

    <!-- Harmonic Peak 2 -->
    <path d="M -80,20 Q -20,-70 20,-30 T 90,-50 L 70,20 Q -10,30 -60,40 Z"
          fill="url(#waveGrad2)" opacity="0.85" />

    <!-- Ridge Peak 3 -->
    <path d="M -50,-20 Q 0,-90 40,-40 T 80,-80 L 60,-20 Q 10,-10 -30,0 Z"
          fill="url(#waveGrad3)" opacity="0.9" />

    <!-- Isometric Surface Wireframe Lines -->
    <path d="M -110,60 Q -50,-10 0,40 T 110,-10 M -90,80 Q -30,10 20,60 T 130,10"
          stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.6" />
    <path d="M -80,20 Q -20,-70 20,-30 T 90,-50"
          stroke="#ffffff" stroke-width="2.5" fill="none" opacity="0.7" />
    <path d="M -110,60 L -80,20 L -50,-20 M -50,-10 L -20,-70 L 0,-90 M 0,40 L 20,-30 L 40,-40 M 60,15 L 90,-50 L 80,-80"
          stroke="#ffffff" stroke-width="1.8" fill="none" opacity="0.5" />
  </g>

  <!-- Open Matrix Brackets "[  ]" framing the computation -->
  <g id="brackets" filter="url(#neonGlow)">
    <!-- Left Bracket [ -->
    <path d="M 125,140 L 85,140 L 85,372 L 125,372"
          fill="none" stroke="url(#bracketGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Right Bracket ] -->
    <path d="M 387,140 L 427,140 L 427,372 L 387,372"
          fill="none" stroke="url(#bracketGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Central Matrix Origin Point / Dot -->
  <circle cx="256" cy="245" r="7" fill="#ffffff" filter="url(#neonGlow)" />
</svg>
